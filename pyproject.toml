[project]
name = "nexus-pixel-man-test-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "McDougall", email = "Duncan.McDougall@rfi.ac.uk" }
]
requires-python = ">=3.13"
dependencies = [
    "xartus",
    "argsui",
    "numpy>=2.4.6",
]

license = "Apache-2.0"
license-files = ["LICENSES/*"]

[dependency-groups]
dev = [
 "icecream>=2.2.0",
 "line-profiler>=5.0.2",
 "pytest>=9.1.1",
 "pytest-cov>=7.1.0",
]

[project.scripts]
nexus-pixel-man-test-data = "nexus_pixel_man_test_data:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
xartus = { path = "../xartus", editable = true }

[tool.typos.default.extend-identifiers]
fle = 'fle'

[tool.pytest]
testpaths = ["./tests", "./src/"]
addopts = [
    "--doctest-modules", 
    "--cov=./src/", 
    "--cov-report=html", 
    "--cov-branch",
]
